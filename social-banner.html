<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CICAN Crypto Mining Lab — Social Banner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f5f5f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.banner{width:min(100vw,1500px);min-height:70vh;margin:auto;padding:7vw;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:clamp(13px,1.5vw,20px);letter-spacing:.08em;color:#aaa;margin:0 0 18px}
h1{font-size:clamp(58px,10vw,150px);line-height:.88;letter-spacing:-.05em;margin:0 0 34px}
.hero{max-width:1050px;font-size:clamp(24px,4vw,58px);line-height:1.05;font-weight:800;margin:0 0 22px}
.tagline{font-size:clamp(18px,2vw,28px);color:#ddd;margin:0 0 48px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border:1px solid #252525;border-radius:18px;background:#080808;padding:24px}
.label{font-size:14px;color:#999;margin-bottom:10px}
.value{font-size:clamp(28px,3.4vw,48px);font-weight:800}
.footer{margin-top:38px;font-size:13px;letter-spacing:.06em;color:#777}
@media(max-width:700px){.banner{padding:34px 24px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="banner">
<p class="eyebrow">CICAN CRYPTO MINING LAB</p>
<h1>CICAN</h1>
<p class="hero">Your phone is already a computer.<br>Find out what it can actually mine.</p>
<p class="tagline">Mine. Measure. Compare. Learn.</p>
<section class="stats">
<div class="card"><div class="label">PIXEL 6 · RANDOMX</div><div class="value">317–353 H/s</div></div>
<div class="card"><div class="label">WORKING ESTIMATE</div><div class="value">~337 H/s</div></div>
<div class="card"><div class="label">CAPTURED SHARES</div><div class="value">49 / 49</div></div>
</section>
<p class="footer">REAL DEVICE · REAL MEASUREMENTS · REAL RESULTS</p>
</main>
</body>
</html>
